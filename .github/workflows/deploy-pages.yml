name: Deploy Kodi repository to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'addon.xml'
      - 'release-inputs/**'
      - 'repository.baka/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build repository payload
        run: |
          python tools/build_repo.py --out site/repo --force --pages-url https://flowinthefluid.github.io/baka/repo
          cp .nojekyll site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
